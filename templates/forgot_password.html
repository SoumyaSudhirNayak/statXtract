<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - STATXTRACT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2E7D32;
            --primary-gradient: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
            --secondary-color: #F4A300;
            --text-main: #1C1C1C;
            --text-muted: #6B7280;
            --bg-page: linear-gradient(135deg, #F0F4FF 0%, #E8F5E9 50%, #FFF8E1 100%);
            --surface-bg: rgba(255, 255, 255, 0.92);
            --surface-muted: #F8FAFC;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(209, 213, 219, 0.5);
            --shadow-light: 0 8px 32px rgba(31, 58, 95, 0.07);
            --shadow-heavy: 0 16px 40px rgba(31, 58, 95, 0.12);
            --border-radius: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --text-on-primary: #FFFFFF;
        }

        [data-theme="dark"] {
            --primary-color: #6366F1;
            --primary-gradient: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            --text-main: #F8FAFC;
            --text-muted: rgba(255, 255, 255, 0.7);
            --bg-page: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
            --surface-bg: rgba(15, 23, 42, 0.78);
            --surface-muted: rgba(30, 41, 59, 0.9);
            --glass-bg: rgba(15, 23, 42, 0.78);
            --glass-border: rgba(100, 116, 139, 0.25);
            --shadow-light: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            color: var(--text-main);
            transition: var(--transition);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
        }
        .bg-orb-1 { width: 700px; height: 700px; background: #2E7D32; top: -200px; left: -200px; }
        .bg-orb-2 { width: 500px; height: 500px; background: #2E5BBA; bottom: -100px; right: -100px; opacity: 0.09; }

        .top-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-weight: 500;
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }

        .main-container {
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow-light);
            position: relative;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--shadow-heavy);
            transition: var(--transition);
            margin-bottom: 20px;
        }

        .glass-card:hover {
            box-shadow: 0 24px 60px rgba(31, 58, 95, 0.16);
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            background: var(--surface-muted);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .form-input:hover {
            border-color: #9CA3AF;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background: var(--primary-gradient);
            color: var(--text-on-primary);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.35);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 300px;
            background: var(--surface-bg);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-heavy);
            border: 1px solid var(--glass-border);
            font-size: 14px;
            font-weight: 500;
            animation: slideInRight 0.3s ease;
            color: var(--text-main);
        }
        .toast.success { border-left: 4px solid var(--primary-color); }
        .toast.error   { border-left: 4px solid #D4183D; }
        @keyframes slideInRight  { from { transform: translateX(120px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes slideOutRight { from { transform: none; opacity: 1; } to { transform: translateX(120px); opacity: 0; } }

        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 0 10px;
            }
            .glass-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-canvas">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
    </div>

    <!-- Top Actions -->
    <div class="top-actions">
        <div class="action-btn theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
            <span id="themeToggleText">Dark Mode</span>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="main-container" id="resetCard">
        <div class="header">
            <h1><i class="fas fa-key"></i> Reset Password</h1>
            <p>Enter your details below to set a new password</p>
        </div>

        <div class="glass-card">
            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> New Password
                    </label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-key"></i></span>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-shield-alt"></i> Confirm New Password
                    </label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-check-double"></i></span>
                        <input type="password" id="confirm_password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-sync-alt"></i> Reset Password
                </button>
            </form>

            <div class="footer-links">
                <a href="/user/login"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const toggle = document.querySelector('#themeToggleText');
            const icon = document.querySelector('.theme-toggle i');
            if(!toggle) return;
            if(theme === 'dark') {
                toggle.textContent = 'Light Mode';
                icon.className = 'fas fa-sun';
            } else {
                toggle.textContent = 'Dark Mode';
                icon.className = 'fas fa-moon';
            }
        }

        (function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        })();

        function showToast(msg, type = 'info') {
            const tc = document.getElementById('toastContainer');
            const t  = document.createElement('div');
            t.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            t.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
            tc.appendChild(t);
            setTimeout(() => {
                t.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => t.remove(), 300);
            }, 4000);
        }

        function shakeCard() {
            const card = document.getElementById('resetCard');
            card.style.animation = 'shakeX 0.45s ease';
            setTimeout(() => card.style.animation = '', 450);
        }

        async function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!email || !password || !confirmPassword) {
                showToast('Please fill in all fields.', 'error');
                shakeCard();
                return;
            }

            if (password !== confirmPassword) {
                showToast('Passwords do not match.', 'error');
                shakeCard();
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    showToast('Password reset successfully. Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/user/login?success=Password+reset+successfully.';
                    }, 1500);
                } else {
                    const data = await res.json().catch(() => ({}));
                    showToast(data.detail || 'Failed to reset password.', 'error');
                    shakeCard();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Reset Password';
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                shakeCard();
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Reset Password';
            }
        }
    </script>
</body>
</html>
